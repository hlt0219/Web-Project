<script type="text/javascript">
function MM_preloadImages() {
  var d=document; 
  if(d.images){
    if(!d.MM_p) d.MM_p=new Array();
    var i,j=d.MM_p.length,a=MM_preloadImages.arguments;
    for(i=0; i<a.length; i++)
    if (a[i].indexOf("#")!=0){
      d.MM_p[j]=new Image;
      d.MM_p[j++].src=a[i];
    }
  }
}
</script>

<style type="text/css">

body,td,th {
    font-family: Cambria, "Hoefler Text", "Liberation Serif", Times, "Times New Roman", serif;
    color: #000000;
}

body {
    background-color: darkblue;
}

/* Centering */
.center-wrapper {
    text-align: center;
}

/* Inputs */
input[type=text],
input[type=password] {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

/* BUTTONS (CHANGED TO BLUE) */
button {background-color: #0066cc; color: white; padding: 14px 20px; margin: 8px 0; border: none; cursor: pointer;}

button:hover {
  opacity: 0.8;
}

/* Cancel button
.cancelbtn {width: auto; padding: 10px 18px; background-color: #0066cc;
}

.container {
  padding: 16px;
}

/* Forgot password */
span.psw { float: right; padding-top: 16px;}

/* Modal Background */
.modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: transparent; padding-top: 60px;}

.modal-content {  background-color: #fefefe; margin: 5% auto; border: 1px solid #888; width: 50%; border-radius: 8px;}

.close {position: absolute; right: 25px; top: 0; color: #000; font-size: 35px; font-weight: bold;
}

.close:hover,
.close:focus {color: red; cursor: pointer;
}

/* Animation */
.animate { animation: animatezoom 0.6s;}

@keyframes animatezoom {
  from {transform: scale(0)}
  to {transform: scale(1)}
}

/* Responsive */
@media screen and (max-width: 300px) {
  span.psw {
     display: block;
     float: none;
  }

  .cancelbtn {
     width: 100%;
  }
}

</style>

<script>

// Close modals when clicking outside
window.onclick = function(event) {

  var signupModal = document.getElementById('signupModal');
  var loginModal = document.getElementById('loginModal');

  if (event.target == signupModal) {
    signupModal.style.display = "none";
  }

  if (event.target == loginModal) {
    loginModal.style.display = "none";
  }
}

</script>
